<!doctype html><meta charset="utf-8"><body style="margin:0"><script type="module">
// QA view of the rigged golfer through the game's own rig code (src/client/golferrig.ts): same neutral background and lighting as
// scripts/qa/render-assets.mjs. The asset loads directly here (no PASS gate) because this page is what the critic judges.
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import { clone as cloneSkinned } from 'three/examples/jsm/utils/SkeletonUtils.js';
import { normalise } from '/src/client/assets.ts';
import { GolferRig, tintPolo } from '/src/client/golferrig.ts';
import { POSES, backswingPose, releasePose, puttPose, walkPose } from '/src/client/golferanim.ts';
import { CLUBS, makeCodeClub } from '/src/client/clubs.ts';
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(640, 640); document.body.append(r.domElement);
const V = { front: [0, 0, 1], side: [1, 0, 0], back: [0, 0, -1], dtl: [-1, 0.12, 0], faceon: [0, 0.08, 1], threequarter: [0.7, 0.3, 0.9] };
const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('/assets/models/golfer.glb');
// show(view, pose, {club, tint, depth, ms}): pose is 'rest' | 'idle' | 'address' | 'top' | 'back' (depth) | 'release' (depth, ms) | 'putt' | 'walk'
window.show = (view, pose, o = {}) => {
  const model = normalise(cloneSkinned(gltf.scene), 1.8), rig = new GolferRig(model), spec = CLUBS[o.club ?? 6];
  if (o.tint) tintPolo(model, o.tint);
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#8a8a8a'); scene.add(model);
  scene.add(new THREE.HemisphereLight('#ffffff', '#707070', 1.6)); const key = new THREE.DirectionalLight('#ffffff', 2.2); key.position.set(3, 5, 4); const fill = new THREE.DirectionalLight('#ffffff', 0.8); fill.position.set(-4, 2, -3); scene.add(key, fill);
  let p = null;
  if (pose === 'idle') p = POSES.idle; else if (pose === 'address') p = backswingPose(0, spec.length); else if (pose === 'top') p = backswingPose(1, spec.length);
  else if (pose === 'back') p = backswingPose(o.depth ?? 0.5, spec.length); else if (pose === 'release') p = releasePose(o.depth ?? 1, o.ms ?? 0, spec.length).pose;
  else if (pose === 'putt') p = puttPose(o.t ?? 0, spec.length); else if (pose === 'walk') p = walkPose(o.phase ?? 1, 1);
  if (p) { const club = makeCodeClub(spec); club.matrixAutoUpdate = false; rig.apply(p, club.matrix); model.add(club); }
  model.updateMatrixWorld(true);
  // fixed frame (a skinned mesh's box is its bind pose): 2.4 m tall around the golfer, the same for every shot
  const c = o.face ? new THREE.Vector3(0, 1.62, 0) : new THREE.Vector3(0, 1.0, 0.2), s = new THREE.Vector3(1.8, 2.4, 1.8), d = o.face ? 1.3 : 2.4 * 2.3;   // o.face: head close-up
  const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 1000), v = new THREE.Vector3(...V[view]).normalize(); cam.position.copy(c).addScaledVector(v, d); cam.lookAt(c);
  r.render(scene, cam); let tris = 0; gltf.scene.traverse(m => { if (m.isMesh) tris += m.geometry.index ? m.geometry.index.count / 3 : 0; });
  return { size: s.toArray().map(n => +n.toFixed(2)), tris };
};
window.ready = true;
</script>
